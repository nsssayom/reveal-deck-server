<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0e13">
<title>Speaker view</title>
<link rel="stylesheet" href="/speaker.css">
</head>
<body data-layout="wide">
  <header class="toolbar">
    <div class="toolbar-group toolbar-title">
      <span id="deckName" class="deck-name">—</span>
      <span id="counter" class="counter">—</span>
    </div>

    <div class="toolbar-group toolbar-center">
      <button id="timerToggle" class="timer-btn" title="Click to pause, double-click to reset" aria-label="Timer">
        <span id="timer">00:00</span>
      </button>
    </div>

    <div class="toolbar-group toolbar-tools">
      <div class="segmented" role="tablist" aria-label="Layout">
        <button data-layout="wide" class="seg-btn" title="Side-by-side layout" aria-label="Wide layout">
          <svg viewBox="0 0 26 16" width="26" height="16" aria-hidden="true">
            <rect x="1" y="1" width="15" height="14" rx="1.4" fill="currentColor"/>
            <rect x="18" y="1" width="7" height="6.5" rx="1" fill="currentColor" opacity=".65"/>
            <rect x="18" y="8.5" width="7" height="6.5" rx="1" fill="currentColor" opacity=".65"/>
          </svg>
        </button>
        <button data-layout="tall" class="seg-btn" title="Stacked layout" aria-label="Tall layout">
          <svg viewBox="0 0 26 16" width="26" height="16" aria-hidden="true">
            <rect x="1" y="1" width="24" height="9" rx="1.4" fill="currentColor"/>
            <rect x="1" y="11" width="11" height="4" rx="1" fill="currentColor" opacity=".65"/>
            <rect x="14" y="11" width="11" height="4" rx="1" fill="currentColor" opacity=".65"/>
          </svg>
        </button>
        <button data-layout="reader" class="seg-btn" title="Notes-only layout" aria-label="Reader layout">
          <svg viewBox="0 0 26 16" width="26" height="16" aria-hidden="true">
            <rect x="3" y="3" width="20" height="1.6" rx="0.8" fill="currentColor"/>
            <rect x="3" y="6.5" width="18" height="1.6" rx="0.8" fill="currentColor" opacity=".8"/>
            <rect x="3" y="10" width="20" height="1.6" rx="0.8" fill="currentColor" opacity=".8"/>
            <rect x="3" y="13.5" width="14" height="1.6" rx="0.8" fill="currentColor" opacity=".6"/>
          </svg>
        </button>
      </div>

      <span class="tool-sep" aria-hidden="true"></span>

      <div class="segmented" role="group" aria-label="Notes font size">
        <button id="fontDown" class="seg-btn seg-btn-text" title="Smaller notes (−)" aria-label="Decrease notes size">A−</button>
        <button id="fontUp" class="seg-btn seg-btn-text" title="Larger notes (+)" aria-label="Increase notes size">A+</button>
      </div>

      <span class="tool-sep" aria-hidden="true"></span>

      <button id="fullscreenBtn" class="icon-btn" title="Fullscreen (F)" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div id="conn" class="conn-indicator" title="Server connection"></div>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <section class="pane pane-deck">
      <iframe id="deck" title="Current slide" allow="fullscreen"></iframe>
    </section>

    <div id="splitter" class="splitter" role="separator" aria-label="Resize" tabindex="0"></div>

    <section class="pane pane-side">
      <div class="pane-notes">
        <span class="pane-label">Notes</span>
        <div id="notes" class="notes" aria-live="polite"><em class="empty">No notes.</em></div>
      </div>
    </section>
  </main>

  <footer class="controlbar">
    <button id="prev" class="ctrl-btn ctrl-prev" type="button" aria-label="Previous">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Prev</span>
    </button>
    <button id="next" class="ctrl-btn ctrl-next" type="button" aria-label="Next">
      <span>Next</span>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/speaker.js"></script>
</body>
</html>
